[package]
name = "scenarium-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "First-party browser consumer of unchanged SCENARIUM run comparison"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "scenarium-compare"
path = "src/main.rs"

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
scenarium = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.127", optional = true }
